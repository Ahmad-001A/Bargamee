<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SNG GAME BAR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Шапка в киберспортивном стиле -->
    <header class="app-header">
      <div class="logo-container">
        <span class="logo-icon">🎮</span>
        <h1 class="logo-title">SNG <span class="neon-text">GAME BAR</span></h1>
      </div>
      <p class="subtitle">⚡ МОМЕНТАЛЬНОЕ ПОПОЛНЕНИЕ ИГР</p>
    </header>

    <!-- Экран 1: Каталог -->
    <section id="screen-catalog" class="screen active">
      <div class="section-label"><span class="pulse-dot"></span> Выберите игру</div>
      <div class="game-grid" id="game-grid"></div>
    </section>

    <!-- Экран 2: Оформление заказа -->
    <section id="screen-order" class="screen">
      <button type="button" class="btn-back" onclick="showCatalog()">◀ НАЗАД В КАТАЛОГ</button>

      <div class="game-banner-card">
        <img id="order-game-img" src="" alt="Game Poster" referrerpolicy="no-referrer">
        <div class="game-banner-info">
          <h2 id="order-game-title">Название игры</h2>
          <p id="order-game-desc">Описание</p>
        </div>
      </div>

      <!-- Выбор региона -->
      <div class="form-group" id="group-region" style="display: none;">
        <label id="region-label" class="label">ВЫБОР СЕРВЕРА / РЕГИОНА:</label>
        <div id="region-tags" class="tags-container"></div>
      </div>

      <!-- Ввод ID -->
      <div class="form-group">
        <label class="label">ДАННЫЕ АККАУНТА (USER ID / НИК):</label>
        <div class="input-wrapper">
          <input type="text" id="player-id" class="input-field" placeholder="Введите ваш ID игрока" autocomplete="off">
        </div>
      </div>

      <!-- Выбор товара -->
      <div class="form-group">
        <label class="label">ВЫБЕРИТЕ ДУНАТ-ПАКЕТ:</label>
        <div id="goods-container"></div>
      </div>

      <!-- Способ оплаты -->
      <div class="form-group">
        <label class="label">СПОСОБ ОПЛАТЫ:</label>
        <div class="payment-selector">
          <button type="button" class="pay-card active" id="pay-alif" onclick="selectPayment('Алиф Моби')">
            <span class="pay-title">Алиф Моби</span>
          </button>
          <button type="button" class="pay-card" id="pay-dc" onclick="selectPayment('DC Bank')">
            <span class="pay-title">DC Bank</span>
          </button>
        </div>
      </div>

      <!-- Реквизиты -->
      <div class="requisites-card">
        <span class="req-title">Переведите сумму на <strong id="req-method-name">Алиф Моби</strong>:</span>
        <div class="req-number-row">
          <span id="req-number">+992931088151</span>
          <button type="button" class="btn-copy" onclick="copyRequisites()">Скопировать</button>
        </div>
      </div>

      <!-- Загрузка чека -->
      <div class="form-group">
        <label class="label">ПРИКРЕПИТЕ СКРИНШОТ ЧЕКА:</label>
        <label for="receipt-file" class="file-dropzone" id="file-dropzone">
          <div class="dropzone-content">
            <span class="dropzone-icon">📸</span>
            <span id="file-text">НАЖМИТЕ, ЧТОБЫ ВЫБРАТЬ ЧЕК</span>
          </div>
        </label>
        <input type="file" id="receipt-file" accept="image/*" onchange="onFileSelected()">
      </div>

      <!-- Статус -->
      <div id="status-message" class="status-box" style="display: none;"></div>

      <!-- Кнопка -->
      <button type="button" class="btn-primary" id="btn-submit" onclick="submitOrder()">
        <span>ОФОРМИТЬ ЗАКАЗ 🚀</span>
      </button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
