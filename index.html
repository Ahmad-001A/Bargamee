  <style>
    :root {
      --bg-main: #0a0d14;
      --bg-card: rgba(18, 24, 38, 0.7);
      --bg-card-hover: rgba(30, 41, 59, 0.8);
      --accent: #00f0ff;
      --accent-purple: #8b5cf6;
      --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 240, 255, 0.5);
      --success: #22c55e;
      --error: #ef4444;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(112,0,255,0.1) 50%, transparent 70%);
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      padding: 16px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: var(--accent-gradient);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-status {
      font-size: 12px;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
    }

    .screen {
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 520px) {
      .game-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover, .game-card:active {
      transform: translateY(-3px);
      border-color: var(--border-active);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .game-cover-wrap {
      position: relative;
      width: 100%;
      padding-top: 60%;
      overflow: hidden;
      background: #1e293b;
    }

    .game-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .game-card:hover .game-cover {
      transform: scale(1.05);
    }

    .game-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
    }

    .game-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .game-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .game-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .game-btn-action {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      cursor: pointer;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
    }

    .order-header-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .order-header-img {
      width: 70px;
      height: 70px;
      border-radius: var(--radius-md);
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
      letter-spacing: 0.5px;
    }

    .tags-flex {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-btn.active {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent);
    }

    .cat-title {
      font-size: 13px;
      font-weight: 700;
      margin: 16px 0 10px 0;
      color: var(--accent);
    }

    .goods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .goods-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 70px;
    }

    .goods-card.selected {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.08);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    .goods-name {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .goods-price {
      font-size: 12px;
      color: var(--accent);
      font-weight: 800;
      margin-top: 6px;
    }

    .goods-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--accent-gradient);
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      color: #000;
    }

    .input-field {
      width: 100%;
      padding: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .pay-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .pay-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: var(--radius-md);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .pay-card.active {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent);
    }

    .req-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border);
      padding: 14px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .req-num {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
    }

    .copy-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .file-upload-wrap {
      position: relative;
    }

    .file-input {
      display: none;
    }

    .file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: var(--bg-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.25);
      transition: all 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-box {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      word-break: break-word;
    }

    .status-box.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #fca5a5;
    }

    .status-box.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: #86efac;
    }

</head>

  <div class="app-container">
    
    <header class="header">
      <div class="brand">
        <div class="brand-icon">🎮</div>
        <div>
          <div class="brand-title">SNG GAME BAR</div>
          <div class="brand-status"><span class="status-dot"></span> Пополнение 24/7</div>
        </div>
      </div>
    </header>

    <main id="screen-catalog" class="screen active">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Поиск игры или услуги..." oninput="filterGames()">
      </div>

      <div class="section-title">Выберите игру</div>
      <div id="game-grid" class="game-grid"></div>
    </main>

    <main id="screen-order" class="screen">
      <div class="nav-back" onclick="showCatalog()">◀ Назад в каталог</div>

      <div class="order-header-card">
        <img id="order-game-img" src="" class="order-header-img" alt="">
        <div>
          <h2 id="order-game-title" style="font-size: 18px; font-weight: 800;"></h2>
          <p id="order-game-desc" style="font-size: 12px; color: var(--text-muted);"></p>
        </div>
      </div>

      <div id="group-region" class="form-group" style="display: none;">
        <label id="region-label" class="form-label">ВЫБЕРИТЕ СЕРВЕР / РЕГИОН:</label>
        <div id="region-tags" class="tags-flex"></div>
      </div>

      <div class="form-group">
        <label class="form-label">ВЫБЕРИТЕ ТОВАР:</label>
        <div id="goods-container"></div>
      </div>

      <div class="form-group">
        <label class="form-label">ВАШ PLAYER ID / ТЕГ / АККАУНТ:</label>
        <input type="text" id="player-id" class="input-field" placeholder="Например: 512345678">
      </div>

      <div class="form-group">
        <label class="form-label">СПОСОБ ОПЛАТЫ:</label>
        <div class="pay-grid">
          <div id="pay-alif" class="pay-card active" onclick="selectPayment('Алиф Моби')">Алиф Моби</div>
          <div id="pay-dc" class="pay-card" onclick="selectPayment('DC Bank')">DC Bank</div>
        </div>

        <div class="req-box">
          <div>
            <div id="req-method-name" style="font-size: 11px; color: var(--text-muted);">Перевод на Алиф Моби:</div>
            <div id="req-number" class="req-num">+992931088151</div>
          </div>
          <button type="button" class="copy-btn" onclick="copyRequisites()">СКОПИРОВАТЬ</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">ПРИКРЕПИТЕ СКРИНШОТ ЧЕКА:</label>
        <div class="file-upload-wrap">
          <input type="file" id="receipt-file" class="file-input" accept="image/*" onchange="onFileSelected()">
          <label for="receipt-file" class="file-btn">
            <span>🧾</span> <span id="file-text">НАЖМИТЕ, ЧТОБЫ ВЫБРАТЬ ЧЕК</span>
          </label>
        </div>
      </div>

      <div id="status-message" class="status-box"></div>

      <button id="btn-submit" type="button" class="submit-btn" onclick="submitOrder()">ОТПРАВИТЬ ЗАКАЗ</button>
    </main>

        regions: ["Казахстан / СНГ", "США", "Индия", "Европа"],
        categories: [
          {
            title: "Пакеты CP",
            items: [
              { name: "80 CP", price: "15.0 смн." },
              { name: "420 CP", price: "48.0 смн." },
              { name: "880 CP", price: "90.0 смн." },
              { name: "2400 CP", price: "225.0 смн." }
            ]
          }
        ]
      },
      {
        id: "roblox",
        name: "Roblox",
        desc: "Robux кодами",
        banner: "https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=600&q=80",
        categories: [
          {
            title: "Пакеты Robux",
            items: [
              { name: "100 Robux", price: "20.0 смн." },
              { name: "400 Robux", price: "60.0 смн." },
              { name: "800 Robux", price: "99.0 смн." },
              { name: "2000 Robux", price: "230.0 смн." }
            ]
          }
        ]
      }
    ];

    let selectedGame = null;
    let selectedGoods = null;
    let selectedServerRegion = null;
    let selectedPayment = "Алиф Моби";

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderCatalog(items) {
      const grid = document.getElementById("game-grid");
      grid.innerHTML = "";

      items.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.onclick = () => openGame(game);

        card.innerHTML = `
          <div class="game-cover-wrap">
            ${game.badge ? `<span class="game-badge">${game.badge}</span>` : ''}
            <img src="${game.banner}" class="game-cover" alt="${game.name}" loading="lazy">
          </div>
          <div class="game-info">
            <div>
              <div class="game-title">${game.name}</div>
              <div class="game-desc">${game.desc}</div>
            </div>
            <div class="game-btn-action">ПОПОЛНИТЬ ➔</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterGames() {
      const query = document.getElementById("search-input").value.toLowerCase();
      const filtered = catalog.filter(g => g.name.toLowerCase().includes(query) || g.desc.toLowerCase().includes(query));
      renderCatalog(filtered);
    }

    function openGame(game) {
      selectedGame = game;
      resetForm();

      document.getElementById("order-game-title").innerText = game.name;
      document.getElementById("order-game-desc").innerText = game.desc;
      document.getElementById("order-game-img").src = game.banner;

      const regionGroup = document.getElementById("group-region");
      const regionTags = document.getElementById("region-tags");
      regionTags.innerHTML = "";

      const options = game.regions || game.servers;
      if (options && options.length > 0) {
        regionGroup.style.display = "block";
        document.getElementById("region-label").innerText = game.regions ? "РЕГИОН АККАУНТА:" : "ВЫБЕРИТЕ СЕРВЕР:";
        options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `tag-btn ${idx === 0 ? 'active' : ''}`;
          btn.innerText = opt;
          btn.onclick = () => {
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedServerRegion = opt;
          };
          regionTags.appendChild(btn);
        });
        selectedServerRegion = options[0];
      } else {
        regionGroup.style.display = "none";
      }

      const container = document.getElementById("goods-container");
      container.innerHTML = "";

      game.categories.forEach(cat => {
        const catTitle = document.createElement("div");
        catTitle.className = "cat-title";
        catTitle.innerText = cat.title;
        container.appendChild(catTitle);

        const grid = document.createElement("div");
        grid.className = "goods-grid";

        cat.items.forEach(item => {
          const itemCard = document.createElement("div");
          itemCard.className = "goods-card";
          itemCard.onclick = () => {
            document.querySelectorAll('.goods-card').forEach(c => c.classList.remove('selected'));
            itemCard.classList.add('selected');
            selectedGoods = item;
            hideStatus();
          };

          itemCard.innerHTML = `
            ${item.bonus ? `<span class="goods-badge">${item.bonus}</span>` : ''}
            <div class="goods-name">${item.name}</div>
            <div class="goods-price">${item.price}</div>
          `;
          grid.appendChild(itemCard);
        });

        container.appendChild(grid);
      });

      document.getElementById("screen-catalog").classList.remove("active");
      document.getElementById("screen-order").classList.add("active");
      window.scrollTo(0, 0);
    }

    function showCatalog() {
      resetForm();
      document.getElementById("screen-order").classList.remove("active");
      document.getElementById("screen-catalog").classList.add("active");
      window.scrollTo(0, 0);
    }

    function selectPayment(method) {
      selectedPayment = method;
      document.getElementById("req-method-name").innerText = `Перевод на ${method}:`;

      document.getElementById("pay-alif").classList.toggle("active", method === "Алиф Моби");
      document.getElementById("pay-dc").classList.toggle("active", method === "DC Bank");

      document.getElementById("req-number").innerText = (method === "Алиф Моби") ? "+992931088151" : "+992009096449";
    }

    function copyRequisites() {
      const num = document.getElementById("req-number").innerText;
      navigator.clipboard.writeText(num);
      showStatus("✅ Реквизиты скопированы!", "success");
    }

    function onFileSelected() {
      const fileInput = document.getElementById("receipt-file");
      if (fileInput.files && fileInput.files[0]) {
        document.getElementById("file-text").innerText = "✅ ЧЕК ВЫБРАН: " + fileInput.files[0].name;
        hideStatus();
      }
    }

    function resetForm() {
      selectedGoods = null;
      selectedServerRegion = null;
      hideStatus();
      document.getElementById("player-id").value = "";
      document.getElementById("receipt-file").value = "";
      document.getElementById("file-text").innerText = "НАЖМИТЕ, ЧТОБЫ ВЫБРАТЬ ЧЕК";
    }

    function showStatus(text, type) {
      const box = document.getElementById("status-message");
      box.innerText = text;
      box.className = `status-box ${type}`;
      box.style.display = "block";
    }

    function hideStatus() {
      document.getElementById("status-message").style.display = "none";
    }

    async function submitOrder() {
      hideStatus();

      const playerId = document.getElementById("player-id").value.trim();
      const fileInput = document.getElementById("receipt-file");

      if (!playerId) {
        showStatus("⚠️ Укажите ваш ID / Имя аккаунта!", "error");
        return;
      }
      if (!selectedGoods) {
        showStatus("⚠️ Выберите товар из списка!", "error");
        return;
      }
      if (!fileInput.files || !fileInput.files[0]) {
        showStatus("⚠️ Прикрепите скриншот чека оплаты!", "error");
        return;
      }

      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.innerText = "ОТПРАВКА ЗАКАЗА...";

      const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
      const usernameText = tgUser?.username ? `@${tgUser.username}` : (tgUser?.first_name || "Неизвестный");

      // Безопасный HTML формат (не ломается при специальных символах)
      const caption = 
`🛒 <b>НОВЫЙ ЗАКАЗ В SNG GAME BAR!</b>

👤 <b>Покупатель:</b> ${escapeHtml(usernameText)}
🎮 <b>Услуга/Игра:</b> ${escapeHtml(selectedGame.name)}
🌐 <b>Регион/Сервер:</b> ${escapeHtml(selectedServerRegion || 'Стандарт')}
💎 <b>Товар:</b> ${escapeHtml(selectedGoods.name)}
💵 <b>Цена:</b> ${escapeHtml(selectedGoods.price)}
🆔 <b>ID/Данные:</b> <code>${escapeHtml(playerId)}</code>
💳 <b>Способ оплаты:</b> ${escapeHtml(selectedPayment)}`;

      let successCount = 0;
      let lastErrorMessage = "";

      for (const adminId of ADMIN_IDS) {
        const formData = new FormData();
        formData.append("chat_id", adminId);
        formData.append("photo", fileInput.files[0]);
        formData.append("caption", caption);
        formData.append("parse_mode", "HTML"); // Изменено на HTML для стабильности

        try {
          // ВАЖНО: В fetch НЕТ заголовка 'Content-Type', браузер ставит его автоматически!
          const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
          });
          
          const data = await res.json();
          if (data.ok) {
            successCount++;
          } else {
            console.error("Ошибка Telegram API:", data);
            lastErrorMessage = data.description || "Неизвестная ошибка Telegram";
          }
        } catch (e) {
          console.error("Ошибка сети:", e);
          lastErrorMessage = "Ошибка подключения или размер файла слишком велик.";
        }
      }

      if (successCount > 0) {
        showStatus("🚀 Ваш заказ успешно отправлен! Ожидайте зачисления.", "success");
        btn.innerText = "ОТПРАВЛЕНО!";
      } else {
        showStatus(`❌ Ошибка отправки: ${lastErrorMessage}`, "error");
        btn.disabled = false;
        btn.innerText = "ПОПРОБОВАТЬ СНОВА";
      }
    }

    document.addEventListener("DOMContentLoaded", () => renderCatalog(catalog));
  </script>
</body>
</html>
